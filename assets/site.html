<script>
(function(){
  // reveal on scroll
  var els = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }); }, {threshold:.12});
    els.forEach(function(el){ io.observe(el); });
  } else { els.forEach(function(el){ el.classList.add('in'); }); }

  // count-up numbers: <span class="count" data-to="100" data-suffix="+">
  document.querySelectorAll('.count').forEach(function(el){
    var to = parseFloat(el.dataset.to), suf = el.dataset.suffix || '', pre = el.dataset.prefix || '', t0=null, dur=1200;
    function step(ts){ if(!t0) t0=ts; var p=Math.min((ts-t0)/dur,1); el.textContent = pre + Math.round(to*(1-Math.pow(1-p,3))) + suf; if(p<1) requestAnimationFrame(step); }
    var o = new IntersectionObserver(function(es){ if(es[0].isIntersecting){ requestAnimationFrame(step); o.disconnect(); } }); o.observe(el);
  });

  // typed roles in hero
  var typed = document.querySelector('.typed');
  if (typed) {
    var words = JSON.parse(typed.dataset.words), i=0, j=0, del=false;
    (function tick(){
      var w = words[i]; typed.textContent = w.slice(0, j);
      if(!del && j<w.length){ j++; setTimeout(tick, 55); }
      else if(!del){ del=true; setTimeout(tick, 1600); }
      else if(j>0){ j--; setTimeout(tick, 25); }
      else { del=false; i=(i+1)%words.length; setTimeout(tick, 250); }
    })();
  }

  // skills filter
  var fb = document.querySelectorAll('.skill-filter button');
  fb.forEach(function(b){ b.addEventListener('click', function(){
    fb.forEach(function(x){x.classList.remove('active');}); b.classList.add('active');
    var f=b.dataset.filter;
    document.querySelectorAll('.skill-card').forEach(function(c){ c.hidden = !(f==='all' || c.dataset.group.indexOf(f)>-1); });
  }); });

  // copy buttons
  document.querySelectorAll('.copy-btn').forEach(function(b){ b.addEventListener('click', function(){
    var txt=b.dataset.copy; try { navigator.clipboard.writeText(txt).then(function(){ b.textContent='Copied'; setTimeout(function(){b.textContent='Copy';},1500); }); } catch(e){}
  }); });

  // contact form -> opens email draft
  var form = document.querySelector('.contact-form');
  if (form) form.addEventListener('submit', function(ev){
    ev.preventDefault();
    var d = new FormData(form);
    var body = encodeURIComponent(d.get('message') + '\n\n— ' + d.get('name') + (d.get('org') ? ', ' + d.get('org') : ''));
    var subj = encodeURIComponent('[Portfolio] ' + d.get('topic') + ' — ' + d.get('name'));
    window.location.href = 'mailto:' + form.dataset.to + '?subject=' + subj + '&body=' + body;
    var s = form.querySelector('.form-status'); if (s) s.textContent = 'Your email app should open with the message ready to send. If it does not, email ' + form.dataset.to + ' directly.';
  });
})();
</script>

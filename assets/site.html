<script>
(function(){
  // reveal on scroll
  var els = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }); }, {threshold:.12});
    els.forEach(function(el){ io.observe(el); });
  } else { els.forEach(function(el){ el.classList.add('in'); }); }

  // count-up numbers: <span class="count" data-to="100" data-suffix="+">
  document.querySelectorAll('.count').forEach(function(el){
    var to = parseFloat(el.dataset.to), suf = el.dataset.suffix || '', pre = el.dataset.prefix || '', t0=null, dur=1200;
    function step(ts){ if(!t0) t0=ts; var p=Math.min((ts-t0)/dur,1); el.textContent = pre + Math.round(to*(1-Math.pow(1-p,3))) + suf; if(p<1) requestAnimationFrame(step); }
    var o = new IntersectionObserver(function(es){ if(es[0].isIntersecting){ requestAnimationFrame(step); o.disconnect(); } }); o.observe(el);
  });

  // typed roles in hero
  var typed = document.querySelector('.typed');
  if (typed) {
    var words = JSON.parse(typed.dataset.words), i=0, j=0, del=false;
    (function tick(){
      var w = words[i]; typed.textContent = w.slice(0, j);
      if(!del && j<w.length){ j++; setTimeout(tick, 55); }
      else if(!del){ del=true; setTimeout(tick, 1600); }
      else if(j>0){ j--; setTimeout(tick, 25); }
      else { del=false; i=(i+1)%words.length; setTimeout(tick, 250); }
    })();
  }

  // skills filter
  var fb = document.querySelectorAll('.skill-filter button');
  fb.forEach(function(b){ b.addEventListener('click', function(){
    fb.forEach(function(x){x.classList.remove('active');}); b.classList.add('active');
    var f=b.dataset.filter;
    document.querySelectorAll('.skill-card').forEach(function(c){ c.hidden = !(f==='all' || c.dataset.group.indexOf(f)>-1); });
  }); });

  // copy buttons
  document.querySelectorAll('.copy-btn').forEach(function(b){ b.addEventListener('click', function(){
    var txt=b.dataset.copy; try { navigator.clipboard.writeText(txt).then(function(){ b.textContent='Copied'; setTimeout(function(){b.textContent='Copy';},1500); }); } catch(e){}
  }); });

  // contact form -> sends directly via FormSubmit; falls back to an email draft
  var form = document.querySelector('.contact-form');
  if (form) form.addEventListener('submit', function(ev){
    ev.preventDefault();
    var d = new FormData(form), st = form.querySelector('.form-status'), btn = form.querySelector('button[type=submit]');
    if (d.get('_honey')) return;
    var payload = { name: d.get('name'), email: d.get('email'), organisation: d.get('org') || '-', topic: d.get('topic'),
                    message: d.get('message'), _subject: '[Portfolio] ' + d.get('topic') + ' from ' + d.get('name'),
                    _template: 'table', _captcha: 'false' };
    btn.disabled = true; btn.textContent = 'Sending…'; st.className = 'form-status small'; st.textContent = '';
    fetch(form.dataset.endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify(payload) })
      .then(function(r){ return r.json().then(function(j){ return { ok: r.ok && String(j.success) !== 'false', j: j }; }); })
      .then(function(res){
        if (!res.ok) throw new Error('failed');
        form.reset(); st.classList.add('ok'); st.textContent = 'Thank you! Your message has been sent. I will reply to your email soon.';
      })
      .catch(function(){
        st.classList.add('err');
        st.innerHTML = 'Sorry, the message could not be sent right now. Please email <b>' + form.dataset.to + '</b> directly.';
      })
      .finally(function(){ btn.disabled = false; btn.textContent = 'Send message →'; });
  });
  // gallery filter + lightbox
  var gb = document.querySelectorAll('.gal-filter button'), items = Array.prototype.slice.call(document.querySelectorAll('.g-item'));
  gb.forEach(function(b){ b.addEventListener('click', function(){
    gb.forEach(function(x){x.classList.remove('active');}); b.classList.add('active');
    items.forEach(function(it){ it.hidden = !(b.dataset.filter==='all' || it.dataset.tool===b.dataset.filter); });
  }); });
  var lb = document.querySelector('.lb');
  if (lb && items.length) {
    var cur = 0, img = lb.querySelector('img'), tt = lb.querySelector('figcaption b'), st = lb.querySelector('figcaption span'), ln = lb.querySelector('figcaption a');
    function vis(){ return items.filter(function(i){ return !i.hidden; }); }
    function show(el){ var v=vis(); cur=v.indexOf(el); img.src=el.dataset.src; img.alt=el.dataset.title; tt.textContent=el.dataset.title; st.textContent=el.dataset.sub; ln.href=el.dataset.link; lb.hidden=false; document.body.style.overflow='hidden'; }
    function close(){ lb.hidden=true; document.body.style.overflow=''; }
    function step(d){ var v=vis(); cur=(cur+d+v.length)%v.length; show(v[cur]); }
    items.forEach(function(it){ it.addEventListener('click', function(){ show(it); }); it.addEventListener('keydown', function(e){ if(e.key==='Enter') show(it); }); });
    lb.querySelector('.lb-close').addEventListener('click', close);
    lb.querySelector('.lb-prev').addEventListener('click', function(){ step(-1); });
    lb.querySelector('.lb-next').addEventListener('click', function(){ step(1); });
    lb.addEventListener('click', function(e){ if(e.target===lb) close(); });
    document.addEventListener('keydown', function(e){ if(lb.hidden) return; if(e.key==='Escape') close(); if(e.key==='ArrowRight') step(1); if(e.key==='ArrowLeft') step(-1); });
  }
})();
</script>

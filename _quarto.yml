project:
  type: website
  output-dir: docs
  resources:
    - assets/files/*
    - projects/*/storyboard.pdf
    - projects/*/*.R
    - assets/video/*

website:
  title: "Moses Okumu"
  description: "Data visualization and analytics portfolio of Moses Okumu: data stories in R, Power BI and Deneb, and the data systems behind them."
  site-url: "https://mose742.github.io/portfolio/"
  repo-url: "https://github.com/mose742/portfolio"
  favicon: assets/img/favicon.svg
  page-navigation: true
  back-to-top-navigation: true
  open-graph: true
  navbar:
    title: "Moses Okumu"
    logo: assets/img/moses.jpg
    logo-alt: "Moses Okumu"
    right:
      - text: Home
        href: index.qmd
      - text: Gallery
        href: gallery.qmd
      - text: Projects
        href: projects/index.qmd
      - text: Training
        href: training.qmd
      - text: Skills
        href: skills.qmd
      - text: Experience
        href: experience.qmd
      - text: Contact
        href: contact.qmd
      - icon: github
        href: https://github.com/mose742
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/mosesokumu
        aria-label: LinkedIn
  page-footer:
    left: "© 2026 Moses Okumu · Nairobi, Kenya"
    right: "Built with [Quarto](https://quarto.org) · Hosted on GitHub Pages"

format:
  html:
    theme:
      light: [cosmo, assets/theme-light.scss]
      dark: [cosmo, assets/theme-dark.scss]
    css: assets/styles.css
    grid:
      body-width: 980px
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
    code-copy: true
    highlight-style: github
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    include-after-body: assets/site.html
